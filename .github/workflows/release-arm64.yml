name: Release arm64-v8a

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. mitra-2.3.6-arm64)'
        required: false
        default: 'mitra-arm64-debug'
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: 'true'
        type: boolean
  push:
    tags:
      - 'mitra-*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build arm64 Debug APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        set -o pipefail
        ./gradlew assembleDebug -PABI_FILTERS=arm64-v8a --stacktrace 2>&1 | tee /tmp/build.log
        echo "=== APKs ==="
        find app/build/outputs -name "*.apk" -exec ls -lh {} \;
        APK=$(find app/build/outputs -name "*arm64*.apk" | head -n 1)
        if [ -z "$APK" ]; then APK=$(find app/build/outputs -name "*.apk" | head -n 1); fi
        echo "APK=$APK" >> $GITHUB_ENV
        cp "$APK" /tmp/mitra-arm64-v8a.apk
        ls -lh /tmp/mitra-arm64-v8a.apk

    - name: Determine tag
      id: tag
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=mitra-arm64-$(date +%Y%m%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT
        fi
        cat $GITHUB_OUTPUT

    - name: Create GitHub Release - arm64 only
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: "Mitra arm64-v8a ${{ steps.tag.outputs.tag }}"
        body: |
          Mitra v2rayNG — arm64-v8a only — built from `${{ github.sha }}` on `arena/01a06dcc-v2rayng`.
          
          - Power beast + Mitra minimal UI
          - Visual proxy chain editor + HUD + latency chips + history sheets
          - `assembleDebug -PABI_FILTERS=arm64-v8a` (debug keystore, for sideload)
          
          Install: download `mitra-arm64-v8a.apk` and sideload.
        files: /tmp/mitra-arm64-v8a.apk
        prerelease: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload arm64 APK as artifact too
      uses: actions/upload-artifact@v7
      with:
        name: mitra-arm64-v8a-apk
        path: /tmp/mitra-arm64-v8a.apk
        if-no-files-found: error
