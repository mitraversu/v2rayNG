name: Build Mitra Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a06dcc-v2rayng

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Debug APK (Mitra)
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        set -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log

    - name: Push build log via API on failure
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=== Build failed, pushing log via API ==="
        tail -n 2000 /tmp/build.log > /tmp/tail.log || echo "no log" > /tmp/tail.log
        cat /tmp/tail.log
        # create file via contents API on branch arena/01a06dcc-v2rayng (overwrite)
        CONTENT=$(base64 -w 0 /tmp/tail.log)
        # try to get existing file sha if exists
        SHA=$(gh api repos/mitraversu/v2rayNG/contents/build-log-tail.txt --jq .sha 2>/dev/null || echo "")
        if [ -n "$SHA" ]; then
          echo "existing sha $SHA"
          gh api --method PUT repos/mitraversu/v2rayNG/contents/build-log-tail.txt \
            --field message="build log ${{ github.run_id }} [skip ci]" \
            --field content="$CONTENT" \
            --field sha="$SHA" \
            --field branch="arena/01a06dcc-v2rayng" || echo "update failed"
        else
          gh api --method PUT repos/mitraversu/v2rayNG/contents/build-log-tail.txt \
            --field message="build log ${{ github.run_id }} [skip ci]" \
            --field content="$CONTENT" \
            --field branch="arena/01a06dcc-v2rayng" || echo "create failed"
        fi
        # also full log
        FULL=$(base64 -w 0 /tmp/build.log 2>/dev/null | head -c 900000) # limit
        if [ -n "$FULL" ]; then
          SHA2=$(gh api repos/mitraversu/v2rayNG/contents/build-log-full.txt --jq .sha 2>/dev/null || echo "")
          if [ -n "$SHA2" ]; then
            gh api --method PUT repos/mitraversu/v2rayNG/contents/build-log-full.txt --field message="full log ${{ github.run_id }}" --field content="$FULL" --field sha="$SHA2" --field branch="arena/01a06dcc-v2rayng" || true
          else
            gh api --method PUT repos/mitraversu/v2rayNG/contents/build-log-full.txt --field message="full log ${{ github.run_id }}" --field content="$FULL" --field branch="arena/01a06dcc-v2rayng" || true
          fi
        fi

    - name: Upload build log artifact on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-log
        path: /tmp/build.log
        if-no-files-found: warn

    - name: Upload Debug APKs
      uses: actions/upload-artifact@v7
      with:
        name: mitra-debug-apks
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/**/debug/*.apk
        if-no-files-found: error

    - name: Upload universal Debug APK (primary)
      uses: actions/upload-artifact@v7
      with:
        name: mitra-universal-debug
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/**/debug/*universal*.apk
        if-no-files-found: warn
